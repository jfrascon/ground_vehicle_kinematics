# Since this parameter file uses variable expansion, it is meant to be use along with an instruction
# ParameterFile(<params_file>, allow_substs=True) in a launch file
/**/three_swerve_kinematics:
  ros__parameters:
    # use_sim_time IS automatically handled, no need to specify here.

    # Why this parameter exists:
    # Inverse kinematics can have more than one valid solution.
    # To choose the best one, the node needs the current wheel states from the last received
    # JointState message.
    # If no JointState has arrived yet, the current state is unknown and the first command can be
    # abrupt.
    # This value defines a waiting time at startup to receive that first JointState.
    # During this waiting time, twist commands are ignored.
    # Commands are accepted when the first JointState arrives or when the waiting time expires.
    initial_wheel_states_reception_period: 10.0 # seconds

    # Numerical parameters of the direct-kinematics least-squares solver.
    direct_solver:
      relative_singular_value_threshold: 1.0e-6
      tikhonov_lambda: 1.0e-4

    # Read the document package://ground_vehicle_kinematics/doc/kinematics_en.pdf
    # for more details about the kinematic configuration described in this parameter file.

    # Wheel positions are described per wheel.
    # Each wheel uses:
    # - radius: wheel radius
    # - dist: distance from the robot base origin to the wheel position
    # - alpha: wheel position angle in radians
    # - beta: wheel orientation angle in radians

    steerable_wheels:
      # The steetable_wheels presented here define a Y-inverted geometry:
      # - steerable_wheel_0: wheel on the robot X axis.
      # - steerable_wheel_1: left wheel.
      # - steerable_wheel_2: right wheel.

      steerable_wheel_0:
        radius: 0.127
        dist: 0.50
        alpha: 3.141592653589793 # rad = pi
        beta: -1.5707963267948966 # rad = pi/2 - alpha_0
        name: "$(var robot_prefix)steerable_wheel_0"
        steering_joint:
          name: "$(var robot_prefix)steerable_wheel_0_steering_joint"
          # Use limits of +-3.1416 rad to allow steering angles up to +-pi rad (+-180 degrees).
          # pi = 3.141592654.... < 3.1416
          limits: {lower: -3.1416, upper: 3.1416}   # rad
        rotation_joint:
          name: "$(var robot_prefix)steerable_wheel_0_rotation_joint"
          limits: {lower: -100.0, upper: 100.0}   # rad/s

      steerable_wheel_1:
        radius: 0.127
        dist: 0.50
        alpha: 2.6878070480712677 # rad = 154 deg
        beta: -1.117010721276371 # rad = pi/2 - alpha_1
        name: "$(var robot_prefix)steerable_wheel_1"
        steering_joint:
          name: "$(var robot_prefix)steerable_wheel_1_steering_joint"
          # Use limits of +-3.1416 rad to allow steering angles up to +-pi rad (+-180 degrees).
          # pi = 3.141592654.... < 3.1416
          limits: {lower: -3.1416, upper: 3.1416}   # rad
        rotation_joint:
          name: "$(var robot_prefix)steerable_wheel_1_rotation_joint"
          limits: {lower: -100.0, upper: 100.0}   # rad/s

      steerable_wheel_2:
        radius: 0.127
        dist: 0.50
        alpha: -2.6878070480712677 # rad = -154 deg
        beta: 4.258603374866164 # rad = pi/2 - alpha_2 = pi/2 - (-alpha_1) = pi/2 + alpha_1
        name: "$(var robot_prefix)steerable_wheel_2"
        steering_joint:
          name: "$(var robot_prefix)steerable_wheel_2_steering_joint"
          # Use limits of +-3.1416 rad to allow steering angles up to +-pi rad (+-180 degrees).
          # pi = 3.141592654.... < 3.1416
          limits: {lower: -3.1416, upper: 3.1416}   # rad
        rotation_joint:
          name: "$(var robot_prefix)steerable_wheel_2_rotation_joint"
          limits: {lower: -100.0, upper: 100.0}   # rad/s
